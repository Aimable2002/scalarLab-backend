[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scalar-lab-backend"
version = "0.1.0"
description = "Backend API for the Scalar Lab experimentation platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "boto3>=1.35,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "huggingface_hub>=0.30,<1",
    "joblib>=1.4,<2",
    "modal>=1.6,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<25",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "scikit-learn>=1.6,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"